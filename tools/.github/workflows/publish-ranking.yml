name: Publish ranking
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write ranking/top100.json
        env:
          UGS_KEY_ID: ${{ secrets.UGS_KEY_ID }}
          UGS_SECRET_KEY: ${{ secrets.UGS_SECRET_KEY }}
          UGS_PROJECT_ID: ${{ secrets.UGS_PROJECT_ID }}
          UGS_ENV_ID: ${{ secrets.UGS_ENV_ID }}
        run: bash tools/publish_top100.sh ranking/top100.json
      - name: Commit if changed
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add ranking/top100.json
          if git diff --cached --quiet -I '"updated"'; then echo "no change"; exit 0; fi
          git commit -m "Ranking: top 100 updated"
          git push
